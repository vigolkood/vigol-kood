 {id:"leonardite",name:"لئوناردیت",cat:"اصلاح‌کننده خاک",price:"استعلام قیمت",numericPrice:null,desc:"محصول اصلاح‌کننده خاک.",usage:"برای مصرف دقیق، مقدار مصرف را طبق برچسب محصول و شرایط خاک و کشت تعیین کنید.",timing:"زمان مصرف بسته به نوع کشت و برنامه اصلاح خاک تعیین می‌شود.",tips:"قبل از اختلاط با سایر نهاده‌ها، سازگاری را بررسی کنید.",available:true,short:"LEONARDITE",image:"",packages:[{size:"۱ کیلو",price:"استعلام قیمت",image:""},{size:"۵ کیلو",price:"استعلام قیمت",image:""},{size:"۱۰ کیلو",price:"استعلام قیمت",image:""}]},
 {id:"fulvic",name:"فولویک اسید",cat:"کود مایع",price:"استعلام قیمت",numericPrice:null,desc:"محصول کودی مایع.",usage:"مقدار مصرف را طبق برچسب محصول و برنامه تغذیه تعیین کنید. در صورت نیاز قبل از مصرف تست اختلاط انجام دهید.",timing:"با توجه به مرحله رشد و برنامه تغذیه کشت.",tips:"از مصرف بیش از مقدار توصیه‌شده خودداری کنید.",available:true,short:"FULVIC ACID",image:"",packages:[{size:"۱ لیتر",price:"استعلام قیمت",image:""},{size:"۵ لیتر",price:"استعلام قیمت",image:""},{size:"۱۰ لیتر",price:"استعلام قیمت",image:""}]},
 {id:"amino",name:"آمینواسید",cat:"کود مایع",price:"استعلام قیمت",numericPrice:null,desc:"محصول کودی مایع.",usage:"مقدار مصرف را طبق برچسب محصول و مرحله رشد گیاه تعیین کنید. برای محلول‌پاشی، سازگاری و شرایط آب‌وهوایی مناسب را در نظر بگیرید.",timing:"بسته به مرحله رشد و برنامه تغذیه کشت.",tips:"قبل از اختلاط با سموم یا کودهای دیگر، سازگاری را بررسی کنید.",available:true,short:"AMINO ACID",image:"",packages:[{size:"۱ لیتر",price:"استعلام قیمت",image:""},{size:"۵ لیتر",price:"استعلام قیمت",image:""},{size:"۱۰ لیتر",price:"استعلام قیمت",image:""}]},
 {id:"sulfur-calcium",name:"گوگرد مایع کلسیمی",cat:"اصلاح‌کننده خاک",price:"استعلام قیمت",numericPrice:null,desc:"محصول اصلاح‌کننده خاک.",usage:"مقدار مصرف را با توجه به شرایط خاک، کشت و برچسب محصول تعیین کنید.",timing:"بر اساس برنامه اصلاح خاک و مرحله کشت.",tips:"از اختلاط خودسرانه با ترکیبات ناسازگار خودداری کنید.",available:true,short:"SULFUR + Ca",image:"",packages:[{size:"۱ لیتر",price:"استعلام قیمت",image:""},{size:"۵ لیتر",price:"استعلام قیمت",image:""},{size:"۱۰ لیتر",price:"استعلام قیمت",image:""}]},
 {id:"sulfur-carbon",name:"گوگرد مایع کربنی",cat:"کود مایع",price:"استعلام قیمت",numericPrice:null,desc:"محصول کودی مایع.",usage:"مقدار مصرف را طبق برچسب محصول و شرایط خاک و کشت تعیین کنید.",timing:"زمان مصرف بر اساس برنامه تغذیه و شرایط کشت تعیین می‌شود.",tips:"پیش از مصرف، دستورالعمل و سازگاری محصول را بررسی کنید.",available:true,short:"CARBON SULFUR",image:"",packages:[{size:"۱ لیتر",price:"استعلام قیمت",image:""},{size:"۵ لیتر",price:"استعلام قیمت",image:""},{size:"۱۰ لیتر",price:"استعلام قیمت",image:""}]}
];

let products=JSON.parse(localStorage.getItem("vigol_products")||"null")||JSON.parse(JSON.stringify(defaultProducts));
products=products.map((p,i)=>Object.assign({},defaultProducts.find(d=>d.id===p.id)||defaultProducts[i]||{},p,{packages:p.packages||((defaultProducts.find(d=>d.id===p.id)||{}).packages||[])}));

function saveOrders(){localStorage.setItem("vigol_orders",JSON.stringify(orders));}

let cart=JSON.parse(localStorage.getItem("vigol_cart")||"{}");
let selectedCategory="همه";
let currentQty=1;

function saveCart(){localStorage.setItem("vigol_cart",JSON.stringify(cart));update()}
function cartCount(){return Object.values(cart).reduce((a,b)=>a+b,0)}
function update(){document.getElementById("count").textContent=cartCount();document.getElementById("count2").textContent=cartCount()}

function toLatinDigits(v){return String(v??"").replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))).replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d)))}
function priceNumber(v){const s=toLatinDigits(v).replace(/[^0-9]/g,"");return s?Number(s):null}

function getProduct(id){return products.find(p=>p.id===id)}

function packageVisual(p,size){
 const pack=(p.packages||[]).find(x=>x.size===size);
 const image=(pack&&pack.image)||p.image||"";
 if(image) return `<img src="${esc(image)}" alt="${esc(p.name)} - ${esc(size||"")}" style="width:100%;height:100%;object-fit:cover;border-radius:13px">`;
 const safeSize=esc(size||"بسته");
 return `<div class="package-art"><div class="package-label"><small>ویگل کود</small><b>${esc(p.name)}</b><span>${safeSize}</span></div></div>`;
}
function packageFor(p,size){
 return (p.packages||[]).find(x=>x.size===size)||(p.packages||[])[0]||{size:"",price:p.price,image:p.image||""};
}
function card(p){
 const first=(p.packages&&p.packages[0])||{size:""};
 const firstImage=first.image||p.image||"";
 return `<article class="card">
   <div class="prodimg">${firstImage?`<img src="${esc(firstImage)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:13px">`:packageVisual(p,first.size)}</div>
   <span class="badge">${esc(p.cat)}</span><h3>${esc(p.name)}</h3>
   <div class="muted">${esc(p.desc)}</div><div class="price">${esc(first.price||p.price)}</div>
   <div class="actions"><button class="btn alt" onclick="showProduct('${p.id}')">جزئیات</button><button class="btn" onclick="add('${p.id}',1,'${esc(first.size)}')">افزودن</button></div>
 </article>`;
}
function showProduct(id,chosenSize=null){
 const p=getProduct(id); if(!p)return;
 const first=(p.packages&&p.packages[0])||{size:"",price:p.price,image:p.image||""};
 const pack=packageFor(p,chosenSize||first.size); currentQty=1;
 document.getElementById("app").innerHTML=`

 const chosen=size||((p.packages&&p.packages[0]&&p.packages[0].size)||"");

 cart[key]=(cart[key]||0)+qty;

     ${orders.length?orders.map(o=>`<div class="admin-item" style="display:block;margin:10px 0"><b>${esc(o.id)}</b> — ${esc(o.date)}<br>مشتری: ${esc(o.name)} | موبایل: ${esc(o.phone)}<br>آدرس: ${esc(o.address)}<br>${o.items.map(x=>`• ${esc(x.product)} — ${esc(x.size)} — تعداد ${x.qty} — ${esc(x.price)}`).join("<br>")}<br><small>وضعیت: ${esc(o.status)} | پرداخت: ${esc(o.paymentStatus)}</small></div>`).join(""):`<p class="muted">هنوز سفارشی در سایت ثبت نشده است.</p>`}
    </div>
    <div class="panel" style="margin-top:20px"><h2>پشتیبان‌گیری</h2>
     <p class="muted">اطلاعات محصولات و تنظیمات را فایل بگیر و در دستگاه دیگر وارد کن.</p>
     <button class="btn" onclick="exportData()">خروجی پشتیبان</button>
     <label class="btn alt" style="display:inline-block;margin-right:7px">ورود پشتیبان<input type="file" accept=".json" onchange="importData(this.files[0])" style="display:none"></label>
     <button class="btn danger" style="margin-right:7px" onclick="resetData()">بازگردانی اولیه</button>
    </div>
   </div>
  </div>
 </section>`;
 window.scrollTo(0,0);
}
function readImageFile(file){
 return new Promise((resolve,reject)=>{
   if(!file){resolve("");return}
   const r=new FileReader();
   r.onload=()=>resolve(r.result);
   r.onerror=reject;
   r.readAsDataURL(file);
 });
}
function previewImageFile(input,targetId){
 const file=input.files&&input.files[0];
 if(!file)return;
 const url=URL.createObjectURL(file);
 document.getElementById(targetId).innerHTML=`<img src="${url}" style="max-width:180px;max-height:180px;border-radius:12px;object-fit:cover;border:1px solid var(--border)" alt="پیش‌نمایش">`;
}
function previewPackageFiles(input,targetId){
 const files=[...(input.files||[])];
 document.getElementById(targetId).innerHTML=files.map(f=>`<img src="${URL.createObjectURL(f)}" alt="پیش‌نمایش بسته">`).join("");
}
async function saveProduct(id){
  if(!requireAdmin()) return;

 const name=document.getElementById("a_name").value.trim();
 const cat=document.getElementById("a_cat").value.trim();
 const price=document.getElementById("a_price").value.trim();
 if(!name||!cat||!price){toast("نام، دسته‌بندی و قیمت نمایشی را وارد کن.");return}
 const old=id?getProduct(id):null;
 const n=document.getElementById("a_numeric").value;
 const lines=document.getElementById("a_packages").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 const oldPackages=old&&Array.isArray(old.packages)?old.packages:[];
 const packageFiles=[...(document.getElementById("a_package_files").files||[])];
 const packageImages=await Promise.all(packageFiles.map(readImageFile));
 const packages=lines.map((line,i)=>{
   const parts=line.split("|");
   const size=(parts.shift()||"").trim();
   const packPrice=parts.join("|").trim()||"استعلام قیمت";
   return {size,price:packPrice,image:packageImages[i]||((oldPackages[i]&&oldPackages[i].image)||"")};
 });
 const imageFile=document.getElementById("a_image_file").files[0];
 const image=imageFile?await readImageFile(imageFile):(old&&old.image)||"";
 const data={name,cat,price,desc:document.getElementById("a_desc").value.trim(),usage:document.getElementById("a_usage").value.trim(),timing:document.getElementById("a_timing").value.trim(),tips:document.getElementById("a_tips").value.trim(),short:document.getElementById("a_short").value.trim()||name,image,packages,available:document.getElementById("a_available").checked,numericPrice:n===""?null:Number(n)};
 if(id){const i=products.findIndex(x=>x.id===id);products[i]=Object.assign({},products[i],data)}
 else{data.id=slugify(name)+"-"+Date.now();products.push(data)}
 saveProducts();toast("محصول و تصاویر ذخیره شد.");adminPage();
}
function deleteProduct(id){
  if(!requireAdmin()) return;

 const p=getProduct(id);
 if(p&&confirm("محصول «"+p.name+"» حذف شود؟")){products=products.filter(x=>x.id!==id);delete cart[id];saveProducts();saveCart();adminPage()}
}
function saveSiteSettings(){
  if(!requireAdmin()) return;

 settings.title=document.getElementById("s_title").value.trim()||defaultSettings.title;
 settings.subtitle=document.getElementById("s_subtitle").value.trim()||defaultSettings.subtitle;
 settings.phone=document.getElementById("s_phone").value.trim()||defaultSettings.phone;
 settings.topText=document.getElementById("s_top").value.trim()||defaultSettings.topText;
 settings.footerText=document.getElementById("s_footer").value.trim()||defaultSettings.footerText;
 saveSettings();refreshSiteChrome();toast("اطلاعات سایت ذخیره شد.");home();
}
function exportData(){
  if(!requireAdmin()) return;

 const blob=new Blob([JSON.stringify({products,settings,orders},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="vigol-kood-backup.json";a.click();URL.revokeObjectURL(a.href);
}
function importData(file){
  if(!requireAdmin()) return;

 if(!file)return;
 const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!d.settings)throw new Error();products=d.products;settings=Object.assign({},defaultSettings,d.settings);orders=Array.isArray(d.orders)?d.orders:[];saveProducts();saveSettings();saveOrders();toast("پشتیبان وارد شد.");adminPage()}catch(e){toast("فایل پشتیبان معتبر نیست.")}};
 r.readAsText(file);
}
function resetData(){
  if(!requireAdmin()) return;

 if(confirm("همه تغییرات محلی حذف و اطلاعات اولیه برگردانده شود؟")){products=JSON.parse(JSON.stringify(defaultProducts));settings=Object.assign({},defaultSettings);orders=[];saveProducts();saveSettings();saveOrders();adminPage()}
}
function filterProducts(v){
 const term=v.trim().toLowerCase();
 if(!term){catalog();return}
 const list=products.filter(p=>(p.name+" "+p.cat+" "+p.short).toLowerCase().includes(term));
 document.getElementById("app").innerHTML=`<section class="wrap"><div class="section-head"><h1>نتیجه جستجو</h1><span class="muted">${list.length} نتیجه</span></div><div class="products">${list.length?list.map(card).join(""):`<div class="noresult">محصولی با این عبارت پیدا نشد.</div>`}</div></section>`;
}
update();refreshSiteChrome();
const adminBtn=document.getElementById("adminNavBtn"); if(adminBtn) adminBtn.style.display=adminUnlocked?"":"none";
home();
</script>
</body>
</html>
